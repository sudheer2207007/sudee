<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SUDEE Secret ❤️</title>

<style>
  body{
    margin:0;
    height:100vh;
    background:linear-gradient(135deg,#ff6a88,#ff99ac);
    font-family:'Segoe UI',sans-serif;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  /* floating emojis */
  .float{
    position:absolute;
    font-size:20px;
    animation:rise 8s linear infinite;
    opacity:.7;
  }
  @keyframes rise{
    0%{transform:translateY(100vh);opacity:0}
    30%{opacity:1}
    100%{transform:translateY(-10vh);opacity:0}
  }

  /* main card */
  .card{
    width:360px;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(12px);
    border-radius:24px;
    padding:25px;
    text-align:center;
    color:#fff;
    box-shadow:0 20px 40px rgba(0,0,0,.25);
    z-index:2;
  }

  h1{
    margin:0;
    font-size:26px;
  }

  .tag{
    font-size:14px;
    margin:6px 0 12px;
    opacity:.9;
  }

  .days{
    font-size:28px;
    font-weight:bold;
    margin:10px 0;
  }

  .clock{
    font-size:16px;
    opacity:.9;
    margin-bottom:10px;
  }

  /* heartbeat line */
  svg{width:100%;height:40px;margin:10px 0}
  .pulse{
    stroke:#fff;
    stroke-width:3;
    fill:none;
    stroke-dasharray:220;
    stroke-dashoffset:220;
    animation:pulse 1.6s linear infinite;
  }
  @keyframes pulse{to{stroke-dashoffset:0}}

  /* spotify */
  iframe{
    margin-top:12px;
    border-radius:14px;
  }
</style>
</head>

<body>

<!-- floating love emojis -->
<div class="float" style="left:8%;animation-delay:0s">❤️</div>
<div class="float" style="left:22%;animation-delay:3s">💖</div>
<div class="float" style="left:40%;animation-delay:6s">💕</div>
<div class="float" style="left:60%;animation-delay:2s">😍</div>
<div class="float" style="left:78%;animation-delay:5s">💘</div>

<!-- love card -->
<div class="card">
  <h1>Sudheer ❤️ Deepu</h1>
  <div class="tag">Two souls · One story · Forever</div>

  <div class="days" id="days"></div>
  <div class="clock" id="clock"></div>

  <!-- heartbeat -->
  <svg viewBox="0 0 300 40">
    <path class="pulse"
      d="M0 20 L40 20 L60 5 L80 35 L100 20
         L140 20 L160 8 L180 32 L200 20
         L240 20 L260 10 L280 30 L300 20"/>
  </svg>

  🎵 Our Love Song
  <iframe
    src="https://open.spotify.com/embed/track/4Te9tTtG4ipT6x6G69DTJd"
    width="100%" height="80"
    frameborder="0"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
  </iframe>
</div>

<script>
  const loveStart=new Date(2023,11,9);

  function updateLove(){
    const now=new Date();
    const days=Math.floor((now-loveStart)/(1000*60*60*24));
    document.getElementById("days").innerHTML=`❤️ ${days} Days Together`;
    document.getElementById("clock").innerHTML=`⏰ ${now.toLocaleTimeString()}`;
  }
  updateLove();
  setInterval(updateLove,1000);
</script>

</body>
</html>
