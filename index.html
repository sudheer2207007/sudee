<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SUDEE ❤️ DEEPU</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #ff4d6d;
      --secondary: #c9184a;
      --bg-gradient: linear-gradient(135deg, #ffc8dd 0%, #ffafcc 100%);
      --glass: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(255, 255, 255, 1);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; height: 100vh; overflow: hidden;
      font-family: 'Fredoka', sans-serif;
      background: #ffdde1;
      background-image: radial-gradient(circle at 50% 50%, #ffffff 0%, #ffdde1 100%);
      display: flex; justify-content: center; align-items: center;
      color: #590d22;
    }

    /* FLOATING BACKGROUND SHAPES */
    .bg-shape {
      position: absolute; border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      animation: float 6s infinite ease-in-out;
      z-index: 1;
    }
    .shape1 { width: 100px; height: 100px; top: 10%; left: 10%; animation-delay: 0s; }
    .shape2 { width: 150px; height: 150px; bottom: 20%; right: 10%; animation-delay: 2s; }
    .shape3 { width: 80px; height: 80px; top: 40%; left: 80%; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    /* MAIN GLASS CARD */
    .card {
      background: var(--glass);
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 3px solid white;
      border-radius: 40px;
      padding: 30px; text-align: center;
      width: 90%; max-width: 380px;
      box-shadow: 0 20px 60px rgba(255, 77, 109, 0.25);
      position: relative; z-index: 10;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* SHAKE ANIMATION */
    .shake { animation: shake 0.5s; }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-10px) rotate(-5deg); }
      50% { transform: translateX(10px) rotate(5deg); }
      75% { transform: translateX(-10px); }
      100% { transform: translateX(0); }
    }

    /* TITLE */
    h1 {
      font-family: 'Pacifico', cursive; font-size: 2.5rem; margin: 0;
      color: var(--primary);
      text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.5);
      margin-bottom: 10px;
    }

    /* --- CUTENESS SCANNER --- */
    .heart-scanner {
      width: 120px; height: 120px; margin: 20px auto;
      position: relative; cursor: pointer;
      transform: scale(1); transition: transform 0.2s;
      filter: drop-shadow(0 10px 15px rgba(255, 77, 109, 0.3));
    }
    .heart-scanner:active { transform: scale(0.95); }

    .heart-bg {
      fill: rgba(255, 255, 255, 0.5); 
      stroke: #ff4d6d;
      stroke-width: 4px;
    }
    
    .liquid {
      fill: #ff4d6d;
      clip-path: url(#heart-clip);
      transform: translateY(100%);
      transition: transform 0.2s linear;
    }
    
    .filling .liquid {
      transform: translateY(0%);
      transition: transform 2.5s ease-in-out;
    }

    .status-text {
      font-size: 1.1rem; color: #800f2f; font-weight: bold;
      min-height: 30px; margin-top: 10px;
    }

    /* --- BUBBLE PIN PAD --- */
    .pin-container {
      display: none; flex-direction: column; align-items: center;
    }

    .bubble-grid {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
      margin: 15px 0; max-width: 260px;
    }

    .bubble-btn {
      width: 60px; height: 60px;
      background: white;
      border: 2px solid #ffccd5;
      color: #ff4d6d;
      border-radius: 50%;
      font-size: 1.8rem;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(255, 77, 109, 0.1);
      transition: 0.2s;
    }
    .bubble-btn:active { transform: scale(0.9); background: #fff0f3; border-color: #ff4d6d; }

    .pass-dots {
      display: flex; gap: 10px; margin-bottom: 15px; height: 20px;
    }
    .dot {
      width: 12px; height: 12px; background: #ffccd5;
      border-radius: 50%; transition: 0.3s;
    }
    .dot.filled { background: #ff4d6d; transform: scale(1.3); }

    /* SECRET MAGGIE GIFT */
    .maggie-gift {
      position: absolute; bottom: 15px; right: 15px;
      font-size: 1.5rem; cursor: pointer; opacity: 0.8;
      transition: transform 0.3s;
    }
    .maggie-gift:hover { transform: scale(1.2) rotate(10deg); }
    
    /* MODIFIED SECRET BOX */
    .secret-box {
      display: none; position: absolute; bottom: 55px; right: 15px;
      background: white; padding: 15px; border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      border: 2px solid #ffccd5;
      z-index: 50;
      text-align: center;
      width: 180px; /* Made wider for text */
    }
    .secret-input {
      width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; text-align: center;
      outline: none; color: #ff4d6d; font-weight: bold;
    }

    /* UNLOCKED VIEW */
    .hidden-card { display: none; opacity: 0; animation: fadeIn 1s forwards; }
    @keyframes fadeIn { to { opacity: 1; } }

    .video-frame {
      border: 4px solid white; border-radius: 20px;
      overflow: hidden; box-shadow: 0 10px 20px rgba(255, 77, 109, 0.2);
      margin-top: 15px;
    }

    /* BUTTON STYLES */
    .action-btn {
      margin-top: 20px; background: #ff4d6d; color: white;
      border: none; padding: 12px 25px; border-radius: 50px;
      font-weight: bold; cursor: pointer; font-size: 1rem;
      box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3);
      transition: 0.2s;
    }
    .action-btn:hover { transform: scale(1.05); background: #e01e37; }

    /* POPUP FOR VALENTINE */
    .surprise-popup {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 2000;
      display: none; justify-content: center; align-items: center;
    }
    .popup-content {
      width: 90%; height: 80%; background: white; border-radius: 20px;
      overflow: hidden; position: relative;
    }
    .close-btn {
      position: absolute; top: 10px; right: 10px;
      background: #ff4d6d; color: white; width: 40px; height: 40px;
      border-radius: 50%; border: none; font-size: 1.2rem; cursor: pointer;
      z-index: 100;
    }

    /* --- FULL SCREEN POPUP FOR BIR.HTML --- */
    .bir-popup {
        display: none; 
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: black; 
        z-index: 3000;
        border: none; border-radius: 0; overflow: hidden;
    }

    /* MOBILE ADJUSTMENTS */
    @media (max-width: 600px) {
      .card { padding: 20px; width: 95%; }
      h1 { font-size: 2.2rem; }
      .bubble-btn { width: 55px; height: 55px; font-size: 1.5rem; }
      .bubble-grid { gap: 10px; }
    }

  </style>
</head>
<body>

<div class="bg-shape shape1"></div>
<div class="bg-shape shape2"></div>
<div class="bg-shape shape3"></div>

<div class="surprise-popup" id="lovePopup">
  <div class="popup-content">
    <button class="close-btn" onclick="togglePopup()">✖</button>
    <iframe id="valFrame" style="width:100%; height:100%; border:none;" src="" allow="autoplay; fullscreen"></iframe>
  </div>
</div>

<div class="bir-popup" id="birPopup">
    <button class="close-btn" onclick="closeBir()" style="z-index:3001;">✖</button>
    <iframe id="birFrame" style="width:100%; height:100%; border:none;" src="" allow="autoplay; encrypted-media; fullscreen"></iframe>
</div>

<div class="card" id="mainCard">

  <div id="step1">
    <h1>Love Check</h1>
    <p style="color: #800f2f; font-size: 0.95rem; margin-bottom:10px;">Hold the heart to fill with Love!</p>
    
    <div class="heart-scanner" id="heartBtn" 
          onmousedown="startFill()" onmouseup="stopFill()" 
          ontouchstart="startFill()" ontouchend="stopFill()">
          
          <svg viewBox="0 0 100 100" width="100%" height="100%">
            <defs>
              <clipPath id="heart-clip">
                <path d="M50 88.9L16.7 55.6C7.2 46.1 7.2 30.9 16.7 21.4 26.2 11.9 41.4 11.9 50.9 21.4L50 22.3 49.1 21.4C58.6 11.9 73.8 11.9 83.3 21.4 92.8 30.9 92.8 46.1 83.3 55.6L50 88.9z"/>
              </clipPath>
            </defs>
            <path class="heart-bg" d="M50 88.9L16.7 55.6C7.2 46.1 7.2 30.9 16.7 21.4 26.2 11.9 41.4 11.9 50.9 21.4L50 22.3 49.1 21.4C58.6 11.9 73.8 11.9 83.3 21.4 92.8 30.9 92.8 46.1 83.3 55.6L50 88.9z"/>
            <rect x="0" y="0" width="100" height="100" class="liquid" />
          </svg>
    </div>

    <div class="status-text" id="status">Hold it... 💕</div>

    <button class="action-btn" onclick="togglePopup()">
        Valentine Surprise 💌
    </button>
  </div>

  <div id="step2" class="pin-container">
    <h1>Who is this?</h1>
    <p style="color:#800f2f; font-size:0.9rem;">Enter Secret Passcode</p>
    
    <div class="pass-dots">
      <div class="dot" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
      <div class="dot" id="dot4"></div>
    </div>

    <div class="bubble-grid">
      <div class="bubble-btn" onclick="pressKey('💍')">💍</div>
      <div class="bubble-btn" onclick="pressKey('🌹')">🌹</div>
      <div class="bubble-btn" onclick="pressKey('😘')">😘</div>
      <div class="bubble-btn" onclick="pressKey('🍫')">🍫</div>
      <div class="bubble-btn" onclick="pressKey('🏠')">🏠</div>
      <div class="bubble-btn" onclick="pressKey('🚀')">🚀</div>
      <div class="bubble-btn" onclick="pressKey('🌙')">🌙</div>
      <div class="bubble-btn" onclick="pressKey('🚗')">🚗</div>
      <div class="bubble-btn" onclick="pressKey('🐼')">🐼</div>
    </div>
    
    <button onclick="clearPass()" style="margin-top:10px; background:transparent; border:none; color:#ff4d6d; font-weight:bold; cursor:pointer;">Reset</button>

    <div class="maggie-gift" onclick="toggleSecret()">🎁</div>
    <div class="secret-box" id="secretBox">
        <p style="margin:0 0 8px 0; font-weight:bold; color:#ff4d6d; font-size:0.9rem;">Contact Sudheer</p>
        <input type="text" id="secretInput" class="secret-input" placeholder="Password?">
    </div>
  </div>

  <div id="step3" class="hidden-card">
    <h1>Sudheer & Deepu</h1>
    <p style="color:#800f2f;">Forever & Always</p>
    <div style="font-size:3.5rem; font-weight:bold; color:#ff4d6d; margin:10px 0;" id="daysCount">0</div>
    <div style="font-size:0.9rem; color:#800f2f;">Days of Love</div>

    <div class="video-frame">
      <div style="position:relative; padding-bottom:56.25%; height:0;">
        <iframe src="https://www.youtube.com/embed/2Vv-BfVoq4g" style="position:absolute; top:0; left:0; width:100%; height:100%; border:none;" allowfullscreen></iframe>
      </div>
    </div>
    <button class="action-btn" onclick="location.reload()">Lock 🔒</button>
  </div>

</div>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-0KJH40K4PM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-0KJH40K4PM');
</script>

<script>
  /* CONFIG */
  const PASSWORD = ['😘', '💍', '🏠', '🚀']; // Defined Password
  const SECRET_PASS = 'open@123'; 
  const NIGHT_ONLY = true; 

  /* --- 1. HEART FILL LOGIC --- */
  let fillTimer;
  const heartBtn = document.getElementById('heartBtn');
  const status = document.getElementById('status');

  function startFill() {
    if(checkTime()) return;
    
    heartBtn.classList.add('filling');
    status.innerText = "Charging Love... 🔋";
    status.style.color = "#ff4d6d";
    
    // Success after 2.5 seconds hold
    fillTimer = setTimeout(() => {
        status.innerText = "LOVE FULL! ❤️";
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#ff4d6d', '#fff'] });
        setTimeout(() => {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'flex';
        }, 1000);
    }, 2500); 
  }

  function stopFill() {
    clearTimeout(fillTimer);
    heartBtn.classList.remove('filling'); // Liquid drains
    if(status.innerText !== "LOVE FULL! ❤️") {
        status.innerText = "Don't let go! 🥺";
        status.style.color = "#800f2f";
        setTimeout(() => { status.innerText = "Hold to fill... 💕"; }, 1000);
    }
  }

  /* --- 2. BUBBLE PASS LOGIC --- */
  let currentPass = [];
  
  function pressKey(emoji) {
    if(currentPass.length < 4) {
      currentPass.push(emoji);
      updateDots();
      if(currentPass.length === 4) checkPass();
    }
  }

  function updateDots() {
    for(let i=1; i<=4; i++) {
        const dot = document.getElementById('dot'+i);
        if(i <= currentPass.length) dot.classList.add('filled');
        else dot.classList.remove('filled');
    }
  }

  function clearPass() {
    currentPass = [];
    updateDots();
  }

  function checkPass() {
    // Check if entered emoji sequence matches the PASSWORD
    if(JSON.stringify(currentPass) === JSON.stringify(PASSWORD)) {
        // Success
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'block';
        confetti({ particleCount: 200, spread: 100 });
        
        // Days Logic
        const start = new Date("2023-12-09");
        const diff = Math.floor((new Date() - start) / (1000*60*60*24));
        document.getElementById('daysCount').innerText = diff;
        
    } else {
        // Fail
        const card = document.getElementById('mainCard');
        card.classList.add('shake');
        setTimeout(() => { 
            card.classList.remove('shake'); 
            clearPass();
        }, 500);
    }
  }

  /* --- 3. MAGGIE SECRET & PASSWORD CHECK --- */
  function toggleSecret() {
    const box = document.getElementById('secretBox');
    const input = document.getElementById('secretInput');
    
    if(box.style.display === 'block') {
        box.style.display = 'none';
    } else {
        box.style.display = 'block';
        input.focus();
    }
  }

  // UPDATED: Check for open@123
  document.getElementById('secretInput').addEventListener('input', function(e) {
    if(e.target.value === SECRET_PASS) {
        
        // Show the popup only if password matches
        const birPopup = document.getElementById('birPopup');
        const birFrame = document.getElementById('birFrame');
        
        birFrame.src = 'bir.html';
        birPopup.style.display = 'block';
        
        // Hide the input box
        document.getElementById('secretBox').style.display = 'none';
        e.target.value = ''; // Clear input
    }
  });

  function closeBir() {
      const birPopup = document.getElementById('birPopup');
      const birFrame = document.getElementById('birFrame');
      birPopup.style.display = 'none';
      birFrame.src = ""; 
  }

  /* --- 4. POPUP (Valentine) --- */
  function togglePopup() {
    const popup = document.getElementById('lovePopup');
    const frame = document.getElementById('valFrame');
    
    if(popup.style.display === 'flex') {
        popup.style.display = 'none';
        frame.src = "";
    } else {
        frame.src = "val.html"; // Requires val.html file
        popup.style.display = 'flex';
    }
  }

  /* --- 5. TIME CHECK --- */
  function checkTime() {
    if(!NIGHT_ONLY) return false;
    const h = new Date().getHours();
    // Block between 12 PM (12) and 1 PM (13)
    if(h > 12 && h < 13) {
      alert("Shh! It's daytime! Come back tonight! ☀️");
      return true; 
    }
    return false;
  }

</script>
</body>
</html>
